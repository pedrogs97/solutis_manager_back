<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <title>Verificação de Ativo</title>
        <style>
            @page {
                size: A4;
                margin-top: 1.5in;
                @top-right {
                    content: url("{{ ri_1 }}");
                }
                @bottom-right {
                    content: "Página " counter(page) " de " counter(pages);
                    font-family: Calibri, sans-serif;
                    font-size: 11pt;
                    color: #000000;
                }
            }

            body {
                text-align: justify;
                text-justify: inter-word;
                font-family: Calibri, sans-serif;
                height: 100%;
                margin: 0; /* Remove default body margin */
                padding: 0; /* Remove default body padding */
            }

            .container {
                display: block;
                width: 100%;
            }

            .title {
                display: flex;
                justify-content: center;
            }

            .paragraph-bold {
                font-style: normal;
                font-weight: bold;
                font-size: 14pt;
                color: #000000;
            }

            .verification-item {
                padding: 16px;
            }

            .verification-table {
                border-collapse: separate;
                border: solid 1px #000000;
                border-radius: 6px;
                padding: 4px;
            }

            .verification-question {
                width: fit-content;
            }

            .verification-options {
                font-weight: 900;
            }

            .verification-row {
                margin-bottom: 10px;
            }

            .verification-cell {
                display: flex;
                align-items: center;
            }

            .verification-label {
                margin-left: 5px;
            }
        </style>
    </head>
    <body class="container">
        <div class="container">
            <div class="title">
                <p class="paragraph-bold">VERIFICAÇÃO DO ATIVO</p>
            </div>
            {% for verification in verifications %}
                <div class="verification-item">
                    <table class="verification-table" aria-describedby="table-detail">
                        <thead><th class="verification-question">{{ verification.question }}</th></thead>
                        <tbody class="verification-options">
                            {% for option in verification.options %}
                                <tr class="verification-row">
                                    <td class="verification-cell">
                                        {% if option.checked %}
                                            <input type="checkbox" id="{{ option.id }}" checked value={{ option.checked }} />
                                        {% else %}
                                            <input type="checkbox" id="{{ option.id }}" />
                                        {% endif %}
                                        <label for="{{ option.id }}" class="verification-label">{{ option.option }}</label>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            {% endfor %}
        </div>
    </div>
    </body>
</html>
